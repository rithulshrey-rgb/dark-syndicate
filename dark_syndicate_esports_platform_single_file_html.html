    const UpiQrCode = ({ upiId, amount, payeeName }) => {
      const upiUri = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&am=${amount}&cu=INR`;

      const matrix = useMemo(() => {
        const size = 21;
        const grid = Array.from({ length: size }, () => Array(size).fill(false));
        let seed = 0;
        for (let i = 0; i < upiUri.length; i++) {
          seed = (seed * 31 + upiUri.charCodeAt(i)) % 1000003;
        }
        const placeFinder = (r0, c0) => {
          for (let r = 0; r < 7; r++) {
            for (let c = 0; c < 7; c++) {
              const isBorder = r === 0 || r === 6 || c === 0 || c === 6;
              const isCenter = r >= 2 && r <= 4 && c >= 2 && c <= 4;
              grid[r0 + r][c0 + c] = isBorder || isCenter;
            }
          }
        };
        placeFinder(0, 0);
        placeFinder(0, size - 7);
        placeFinder(size - 7, 0);

        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const inFinder = (r < 8 && c < 8) || (r < 8 && c >= size - 8) || (r >= size - 8 && c < 8);
            if (!inFinder) {
              seed = (seed * 1664525 + 1013904223) % 4294967296;
              grid[r][c] = (seed & 1) === 1;
            }
          }
        }
        return grid;
      }, [upiUri]);

      return (
        <div className="flex flex-col items-center bg-white p-3 rounded-xl border border-zinc-200 shrink-0">
          <svg viewBox="0 0 21 21" className="w-32 h-32">
            <rect width="21" height="21" fill="#FFFFFF" />
            {matrix.map((row, r) =>
              row.map((cell, c) =>
                cell ? <rect key={`${r}-${c}`} x={c} y={r} width="1" height="1" fill="#09090B" /> : null
              )
            )}
          </svg>
          <span className="mt-1.5 text-[10px] font-mono font-bold text-zinc-900">{upiId}</span>
        </div>
      );
    };

                        </button>
                      </form>

                      <div className="space-y-2.5">
                        {data.roster.map((p) => (
                          <div key={p.id} className="p-3.5 rounded-xl bg-[#09090B] border border-zinc-800 flex items-center justify-between gap-3">
                            <div>
                              <div className="font-semibold text-sm text-white">{p.ign} ({p.role})</div>
                              <div className="text-xs text-zinc-500">Kills: {p.kills} • MVPs: {p.mvps}</div>
                            </div>
                            <div className="flex items-center gap-2">
                              <button
                                onClick={() =>
                                  setData((prev) => ({
                                    ...prev,
                                    roster: prev.roster.map((item) =>
                                      item.id === p.id ? { ...item, kills: item.kills + 5, mvps: item.mvps + 1 } : item
                                    )
                                  }))
                                }
                                className="px-2.5 py-1 rounded text-xs bg-zinc-900 text-emerald-400 border border-zinc-800"
                              >
                                +5 Kills / +1 MVP
                              </button>
                              <button
                                onClick={() =>
                                  setData((prev) => ({
                                    ...prev,
                                    roster: prev.roster.filter((item) => item.id !== p.id)
                                  }))
                                }
                                className="p-1.5 rounded bg-zinc-900 text-zinc-400 hover:text-red-400"
                              >
                                <Icon name="trash" className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>

                      <div className="space-y-2.5 pt-2">
                        <h4 className="font-orbitron font-bold text-xs text-white uppercase">
                          Tryout Applications ({data.applications.length})
                        </h4>
                        {data.applications.map((app) => (
                          <div key={app.id} className="p-3.5 rounded-xl bg-[#09090B] border border-zinc-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                              <div className="font-semibold text-sm text-white">
                                {app.playerName} • <span className="text-red-500">{app.role}</span>
                              </div>
                              <div className="text-xs text-zinc-400 font-mono">
                                UID: {app.uid} • {app.contact}
                              </div>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className="text-xs text-amber-400">{app.status}</span>
                              <button
                                onClick={() =>
                                  setData((prev) => ({
                                    ...prev,
                                    applications: prev.applications.map((item) =>
                                      item.id === app.id ? { ...item, status: 'Invited to Trial' } : item
                                    )
                                  }))
                                }
                                className="px-3 py-1 rounded text-xs font-semibold bg-emerald-600 text-white"
                              >
                                Invite Trial
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
